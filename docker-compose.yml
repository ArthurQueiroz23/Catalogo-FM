version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: frutodamalha-db
    environment:
      POSTGRES_USER: frutodamalha
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: frutodamalha_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frutodamalha"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
