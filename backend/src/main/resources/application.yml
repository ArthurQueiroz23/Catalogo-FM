spring:
  application:
    name: catalogo

  # Carrega backend/.env (se existir) como se fosse um application.properties — é assim que as
  # variáveis do .env.example chegam à aplicação em desenvolvimento local, sem precisar exportar
  # nada manualmente no terminal nem instalar nenhuma dependência extra. "optional:" faz o boot
  # não falhar quando o arquivo não existe (ex.: em produção, onde as variáveis vêm do ambiente
  # real da Railway). Nunca commitar o .env de verdade — ver .gitignore.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é a fonte da verdade do schema — Hibernate só valida, nunca altera o banco.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 60
        one-indexed-parameters: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24h
    issuer: frutodamalha-catalogo
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    base-folder: ${CLOUDINARY_BASE_FOLDER:frutodamalha}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
