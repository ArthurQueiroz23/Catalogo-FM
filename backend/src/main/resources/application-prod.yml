spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: false

logging:
  level:
    com.frutodamalha.catalogo: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

app:
  dev-admin:
    enabled: false
