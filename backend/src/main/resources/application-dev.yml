spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frutodamalha}
    username: ${DB_USERNAME:frutodamalha}
    password: ${DB_PASSWORD:frutodamalha}
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true

logging:
  level:
    com.frutodamalha.catalogo: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

# Administrador criado automaticamente em desenvolvimento (ver AdminBootstrapInitializer),
# apenas se ainda não existir nenhum usuário no banco. Estas credenciais são fracas de propósito
# (é uma máquina local, e estão publicadas no README) — a exigência de senha forte do
# AdminBootstrapInitializer só vale fora deste perfil.
app:
  admin-bootstrap:
    enabled: true
    nome: Administradora
    email: admin@frutodamalha.com.br
    senha: admin123
